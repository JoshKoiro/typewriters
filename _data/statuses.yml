# Status values used in each machine's `status:` field.
#   key   = what you type in the machine file
#   label = what visitors see
#   icon  = emoji shown on the badge (any emoji, or "" for none)
#   color = badge colour (any CSS colour; mid-tones work in both light and dark mode)
#
# All statuses are shown in the gallery by default; visitors narrow it down with the filters.
# Add a new status here (e.g. "wanted") and it appears in the filters automatically.

- key: collection
  label: In collection
  icon: "⌨️"
  color: "#2f7d4f"

- key: for-sale
  label: For sale
  icon: "🏷️"
  color: "#c0392b"

- key: sold
  label: Sold
  icon: "🤝"
  color: "#7a746b"

- key: sighting
  label: Sighting
  icon: "👀"
  color: "#3b6ea5"
